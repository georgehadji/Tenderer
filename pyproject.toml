[project]
name = "tenderer"
version = "0.1.0"
description = "Tender-participation support for small professionals"
requires-python = ">=3.13,<3.15"
dependencies = [
    "defusedxml>=0.7.1",
    "django>=5.2,<5.3",   # newest LTS (docs/architecture.md §4)
    "django-otp>=1.6",
    "gunicorn>=23",
    "jsonschema>=4.26.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "hypothesis",
    "import-linter",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "pytest-django>=4.14.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenderer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false
filterwarnings = ["ignore:No directory at:UserWarning"]  # whitenoise: tests never run collectstatic

[tool.mutmut]  # mutation testing of the money and deadline code (docs/architecture.md §13, H2): scripts/mutation.sh
paths_to_mutate = ["src/tenderer/"]
do_not_mutate = ["*/apps/*", "*/shell/*", "*/sectors/*", "*/jurisdictions/*", "*/core/catalog/*", "*/core/lifecycle/*"]
tests_dir = ["tests/test_pricing.py", "tests/test_rules.py", "tests/test_taxi_costs.py"]  # pure: no database
also_copy = ["tests/", "tenders/", "reference/", "manage.py"]

[tool.coverage.run]
branch = true
source = ["tenderer"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["**/migrations/**"]  # generated by Django

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # Greek text is intended

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts; synthetic passwords of test users
"src/tenderer/apps/**" = ["RUF012"]  # Django Meta and admin idiom: lists as class attributes
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
files = ["src/tenderer/core", "src/tenderer/sectors", "src/tenderer/jurisdictions"]
mypy_path = "src"
explicit_package_bases = true

[tool.importlinter]
root_package = "tenderer"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: shell -> apps -> packs -> core (docs/architecture.md §5.2)"
type = "layers"
layers = [
    "tenderer.shell",
    "tenderer.apps",
    "tenderer.sectors | tenderer.jurisdictions",
    "tenderer.core",
]

[[tool.importlinter.contracts]]
name = "core and packs stay pure: no Django, no HTTP (§5.2 rules 1 and 7)"
type = "forbidden"
source_modules = ["tenderer.core", "tenderer.sectors", "tenderer.jurisdictions"]
forbidden_modules = ["django", "psycopg", "requests", "httpx"]

[[tool.importlinter.contracts]]
name = "Apps reach packs only through the registry that shell fills (§5.2 rule 7)"
type = "forbidden"
source_modules = ["tenderer.apps"]
forbidden_modules = ["tenderer.sectors", "tenderer.jurisdictions"]
