# Development database only: synthetic data, never real client data (docs/architecture.md §9).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tenderer
      POSTGRES_USER: tenderer
      POSTGRES_PASSWORD: dev-only-password
    ports:
      - "127.0.0.1:${TENDERER_DB_PORT:-5432}:5432"  # set TENDERER_DB_PORT if 5432 is taken
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
